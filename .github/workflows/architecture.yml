name: architecture

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  gates:
    name: Gates de arquitectura y boundaries de paquetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Verificar limites arquitectonicos (R1-R6)
        run: pnpm verificar:limites --all
