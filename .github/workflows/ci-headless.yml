name: ci-headless

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      spec:
        description: "Ruta de spec específica a probar (opcional, ej: e2e/06-visual-validations.spec.ts)"
        required: false
        default: ""

concurrency:
  group: ci-headless-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless-e2e:
    name: Pruebas Headless E2E y Visuales
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_SECRET: ${{ secrets.AUTH_SECRET || secrets.NEXTAUTH_SECRET || 'ci-headless-test-secret-min-32-chars-long' }}
      NEXTAUTH_SECRET: ${{ secrets.AUTH_SECRET || secrets.NEXTAUTH_SECRET || 'ci-headless-test-secret-min-32-chars-long' }}
      NEXTAUTH_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/testdb
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Configurar pnpm 12.6.0
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Esperar a que PostgreSQL esté listo
        run: |
          for i in {1..60}; do
            pg_isready -h 127.0.0.1 -p 5432 -U postgres && break
            echo "Esperando a PostgreSQL..."
            sleep 1
          done

      - name: Preparar base de datos (generación de cliente, migraciones y seed)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/testdb
        run: |
          pnpm db:generate
          pnpm --filter @sportcomplex/db exec prisma migrate deploy --schema prisma/schema.prisma
          pnpm --filter @sportcomplex/db run db:seed


      - name: Construir paquetes (dist/ para alias @sportcomplex/*)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/testdb
        run: pnpm exec turbo run build --filter='!web'

      - name: Compilar aplicación web (Next.js standalone)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/testdb
        run: pnpm --filter web build

      - name: Instalar Chromium y dependencias del sistema
        run: pnpm exec playwright install chromium --with-deps

      - name: Ejecutar pruebas con navegador headless
        env:
          CI: "true"
        run: |
          if [ -n "${{ inputs.spec }}" ]; then
            echo "Ejecutando spec seleccionada: ${{ inputs.spec }}"
            pnpm exec playwright test "${{ inputs.spec }}"
          else
            echo "Ejecutando suite completa E2E y Validaciones Visuales"
            pnpm test:e2e
          fi

      - name: Subir reporte de Playwright y capturas visuales
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-headless-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
