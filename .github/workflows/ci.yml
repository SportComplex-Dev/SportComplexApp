name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  check-hotfix:
    name: Enforcement hotfix/* -> main
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Validar rama hotfix
        run: |
          if [[ "${{ github.head_ref }}" != hotfix/* ]]; then
            echo "::error::Solo ramas hotfix/* pueden mergearse a main"
            exit 1
          fi

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - run: pnpm install --frozen-lockfile
      - name: Construir paquetes (dist/ para paths y OpenAPI)
        run: pnpm build
      - name: Construir @sportcomplex/seed (forzar rebuild para exports catalogo)
        run: pnpm --filter @sportcomplex/seed run build
      - name: Verificar limites arquitectonicos
        run: pnpm verificar:limites
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter web build
      - name: Validar Docker Compose
        run: docker compose -f docker/docker-compose.yml config --quiet
